name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  v2-promotion-gate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run v2 promotion gate
        env:
          SYNTH_CANARY_STAGE: A
          SYNTH_CANARY_WINDOWS: '3'
          SYNTH_CANARY_USE_MOCK_LLM: '1'
          SYNTH_CANARY_MACHINE_REPORT: .synth/canary/promotion-gate-report.json
          SYNTH_CANARY_ARTIFACT_PATH: .synth/canary/latest-stage-report.json
        run: pnpm canary:gate

      - name: Upload v2 gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-promotion-gate-artifacts
          path: |
            .synth/canary/*.json
            docs/NEURONWAVES_V2_CANARY_DRILL_EVIDENCE.md
